<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Success - ComicCraft</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f111a;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #1e1e38;
            border: 2px solid #6c3df4;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: #ffd700;
            font-size: 32px;
            margin-bottom: 15px;
        }

        p {
            color: #cbd5e1;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin: 8px;
            transition: opacity 0.2s;
        }

        .btn-download {
            background: #ffd700;
            color: #111;
        }

        .btn-home {
            background: #6c3df4;
            color: white;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎉 Export Complete!</h1>
        <p>Your comic PDF is ready to view and download.</p>
        {% if pdf_url %}
        <a href="{{ pdf_url }}" class="btn btn-download" download>📥 Download PDF</a>
        {% endif %}
        <a href="/" class="btn btn-home">🏠 Return Home</a>
    </div>
</body>
</html>
